    "recommend": "Background: The objective of this study was to explore the clinical and microbiological outcomes associated with substituting inhaled aztreonam lysine for an intravenous antibiotic in the treatment of acute pulmonary exacerbations of CF. \nMethods: An open-label randomised crossover pilot trial was conducted at a UK CF centre among 16 adults with CF and P. aeruginosa infection. Median [IQR] age was 29.5 [24.5-32.5], mean \u00b1 SD forced expiratory volume in 1 second (FEV1) was 52.4 \u00b1 14.7 % predicted. Over the course of two exacerbations, participants were randomised to sequentially receive 14 days of inhaled aztreonam lysine plus IV colistimethate (AZLI+IV), or dual IV antibiotics (IV+IV). Primary outcome was absolute change in % predicted FEV1. Other outcomes evaluated changes in quality of life, bacterial load and the lung microbiota.\nResults: The difference between mean change in lung function at day 14 between AZLI+IV and IV+IV was +4.6% (95% CI 2.1-7.2, p=0.002). The minimum clinically important difference of the Cystic Fibrosis Revised Questionnaire (CFQ-R) was achieved more frequently with AZLI+IV (10/12, 83.3%) than IV+IV (7/16, 43.8%), p=0.05. No differences were observed for modulation of serum white cell count, C-reactive protein or sputum bacterial load. Microbiome compositional changes were observed with IV+IV (Bray-Curtis r2=0.14, p=0.02), but not AZLI+IV (r2=0.03, p=0.64).\nConclusion: In adults with CF and P. aeruginosa infection experiencing an acute pulmonary exacerbation, AZLI+IV improved lung function and quality of life compared to the current standard treatment. These findings support the need for larger definitive trials of inhaled antibiotics in the acute setting.\nClinical trial registration: EudraCT 2016-002832-34 ClinicalTrials.org NCT02894684.",

    "recommend": "The Cystic Fibrosis Clinic at the Royal Belfast Hospital for Sick Children has treated 31 children with ciprofloxacin, for serious pseudomonas infection in cystic fibrosis, and carefully monitored the safety and acceptability of the drug. Initially, eight very ill children were treated on a named-patient basis, with an encouraging clinical response and few adverse effects. Children aged 10-18 years were included in a study of four consecutive exacerbations of respiratory disease, comparing (i) oral ciprofloxacin in each episode with (ii) ciprofloxacin alternating with intravenous azlocillin and tobramycin. Other children with cystic fibrosis were subsequently treated with ciprofloxacin, as the need arose. In all the groups very few adverse reactions were found; in particular only one child developed arthralgia. A total of 202 children in the UK have been treated with ciprofloxacin on a named-patient basis, and their clinicians have reported 46 adverse events that may have been drug-related. Overall ciprofloxacin appears to be safe and effective in children but concern about the possible occurrence of arthropathy remains and long term follow-up of these children may be necessary.",

    "recommend": "Background: Cystic fibrosis patients have chronic bacterial infections of the respiratory tract, most commonly Pseudomonas aeruginosa. Although controversial, administration of antibiotic therapy during acute pulmonary exacerbations is standard practice. Fluoroquinolones are currently not indicated for use in young children because of the observation of arthropathy and damage to growing cartilage in beagle puppies. Because of its activity against P. aeruginosa and excellent oral bioavailability, ciprofloxacin offers a unique therapeutic alternative for this patient population.\nObjective: This prospective, randomized, double blind study compared the efficacy and safety of sequential intravenous/oral ciprofloxacin vs. ceftazidime/tobramycin in hospitalized pediatric cystic fibrosis patients with an acute pulmonary exacerbation associated with P. aeruginosa infection.\nMethods: One hundred thirty patients (ages 5 to 17 years) were randomized to receive either i.v. ciprofloxacin 10 mg/kg every 8 h for 7 days followed by oral ciprofloxacin 20 mg/kg every 12 h for a minimum of 3 days or i.v. ceftazidime 50 mg/kg every 8 h plus i.v. tobramycin 3 mg/kg every 8 h for a minimum of 10 days. Clinical, bacteriologic and safety responses were assessed throughout the study.\nResults: All 84 patients (median age, 11 years; range, 5 to 17 years) valid for efficacy in both treatment groups demonstrated clinical improvement. Five patients experienced clinical relapses (3 ciprofloxacin, 2 ceftazidime/tobramycin) by the 2- to 4-week follow-up. Intent-to-treat analysis demonstrated similar clinical findings between the two treatment groups at both the end of therapy and follow-up. Clinical improvement correlated with improvement in pulmonary function studies and the acute clinical scoring system but not with bacteriologic eradication of Pseudomonas. DNA profiles demonstrated that irrespective of colony morphology, usually one clonal strain was associated with each pati     "recommend": "A randomized trial of ceftazidime versus placebo was conducted in patients with cystic fibrosis hospitalized for acute respiratory exacerbations. Patients 12 years of age or older were included if they had mild to moderately severe illness according to the following criteria: erythrocyte sedimentation rate less than or equal to 50 mm/hr and less than three other abnormalities (leukocyte count greater than or equal to 15,000/microliter, pulse greater than or equal to 100 beats/min, respirations greater than or equal to 30/min, or temperature greater than or equal to 38.5 degrees C). In all 16 episodes treated with ceftazidime, the patients were rated improved in comparison with 10 of 12 patients treated with placebo. Three placebo-treated patients dropped out of the study within 3 to 5 days because they wanted antibiotic therapy. None of the 15 placebo-treated patients showed clinical deterioration. There were no significant differences in rate of improvement of symptom score, weight gain, or pulmonary function between the two treatment groups. There was no difference in the course during the 6 to 24 months after the study period. Intravenous antibiotics are not essential in the management of all acute respiratory exacerbations of mild to moderate severity in patients with cystic fibrosis.",
    "full_title": "Randomized trial of ceftazidime versus placebo in the management of acute respiratory exacerbations in patients with cystic fibrosis (1987) doi:https://dx.doi.org/10.1016/s0022-3476(87)80217-2"

    "recommend": "40 adult patients with cystic fibrosis (CF) were admitted to hospital with acute exacerbations of infection associated with isolation of Pseudomonas aeruginosa from sputum. The patients were randomly allocated (20 per group) to receive intravenous azlocillin 5 g and gentamicin 80 mg, or oral ciprofloxacin 500 mg. Both treatments were given three times a day for 10 days. The patients were assessed on days 1 and 10, and at 6 weeks. There was a significant improvement in lung function between days 1 and 10 in both groups (p less than 0.001). Significant improvement was maintained at 6 weeks after ciprofloxacin but not in the intravenous group. Improvement after ciprofloxacin was superior at day 10. Sputum weight decreased in both groups (p less than 0.001). Patient-recorded symptoms also improved in both groups. There was no serious toxicity or side-effects. Drug resistant organisms were isolated no more frequently after ciprofloxacin than after intravenous therapy. 17 of the ciprofloxacin-treated patients said they preferred oral treatment to intravenous therapy. Oral ciprofloxacin is a useful short-term treatment for patients with CF who are infected with Ps aeruginosa.",
    "full_title": "Oral ciprofloxacin compared with conventional intravenous treatment for Pseudomonas aeruginosa infection in adults with cystic fibrosis (1987) doi:https://dx.doi.org/10.1016/s0140-6736(87)90062-6"

    "recommend": "Azlocillin, a new acylureidopenicillin, has been compared to carbenicillin in a controlled, double-blind study for acute exacerbations of pulmonary infections in 29 patients with cystic fibrosis. Twenty-six patients were valid for final analysis of their therapeutic results; 12 treated with azlocillin (group I) at mean dosage of 252 mg/kg/day for a mean duration of 13.2 days of treatment, and 14 treated with carbenicillin (group II) at mean dosage of 505 mg/kg/day for a median duration of 12.6 days. Except for one patient of group I who had Staphylococcus aureus in sputum culture, the remaining patients all had Pseudomonas aeruginosa of mucoid colonial morphology with or without the same organism of rough variety in their sputum culture. Therapeutic efficacy was evaluated according to our scoring system of ten clinical factors, five radiological and five pulmonary function factors with 5 points each and 100 points total if perfect. The percentage of patients who improved by 20% or greater in clinical scores was found in 91.7% of patients in group I and 64.3% of patients in group II, which was statistically significantly different. The percentage of patients who improved by 20% or greater in total scores was found in 80% of group I and 45.5% of group II patients, which was less significant than the evaluation of clinical scores alone. Azlocillin was well tolerated and safe in the dosage employed. Its optimal dosage for patients with cystic fibrosis should be established.",

    "recommend": "A double-blind controlled trail of anti-Pseudomonas chemotherapy was carried out in 24 exacerbations of pulmonary disease in patients with cystic fibrosis. Fifteen exacerbations were treated with oxacillin plus sisomicin and carbenicillin (treatment group); nine were treated with oxacillin alone (control group). The planned length of treatment was 14 days. The difference between the failure rate in the treatment group (3/15) and the control group (7/9) was statistically significant (P less than 0.015). The difference in improvement of forced expiratory volume in 1 second was also significant (P less than 0.025). At the end of the study, Pseudomonas aeruginosa was still present in the sputum of all nine patients in the control group, but was not isolated from six of the 15 patients in the treatment group. The data suggest a beneficial role for anti-Pseudomonas chemotherapy in the treatment of acute pulmonary exacerbations in patients with cystic fibrosis.",

    "recommend": "Piperacillin was evaluated as an antipseudomonas antibiotic in a double-blind controlled trial involving 18 pulmonary exacerbations of cystic fibrosis. Standard antibiotic treatment (flucloxacillin plus tobramycin) was compared with standard treatment plus intravenous piperacillin administered according to two regimens. No added benefit from piperacillin was demonstrable on the basis of improvement in symptoms, physical signs, weight gain, pulmonary function tests, radiologic signs, or sputum Pseudomonas bacterial counts. Some patients experienced sensitivity reactions to piperacillin. In vitro, piperacillin was a potent antibiotic against all beta-lactamase-producing mucoid strains of Pseudomonas aeruginosa; however, in spite of the fact that adequate serum antibiotic concentrations were achieved, sputum bacterial counts did not correlate with either the clinical status or the use of piperacillin therapy.",

    "doi": "https://dx.doi.org/10.1002/ppul.1060",
    "recommend": "Our objective was to compare the efficacy, safety, and microbiology of once-daily intravenous (IV) tobramycin with conventional 8-hourly tobramycin/ceftazidime IV therapy for acute Pseudomonas aeruginosa (PA) pulmonary exacerbations in cystic fibrosis (CF). CF patients with PA-induced pulmonary exacerbations were allocated to receive either once-daily tobramycin (Mono) or conventional therapy with tobramycin/ceftazidime given 8-hourly (Conv). The two longitudinal groups received therapy in a double-blind, randomized manner over a period of 2 years. Tobramycin doses were adjusted to achieve a daily area under the time-concentration curve of 100 mg x hr/L in both groups. Results were assessed for both short-term changes (efficacy and safety after 10 days of IV antibiotics during acute exacerbations) and long-term changes (efficacy, safety, and sputum microbiology between study entry and exit). Pulmonary function tests (PFTs) on admission were similar in both groups. After 10 days of IV antibiotics, absolute mean improvements in percent of predicted PFTs were 12.8, 12.1, and 13.7 for forced expiratory volume in 1 sec (FEV(1)), forced vital capacity (FVC), and forced expired flow between 25--75% of FVC (FEF(25--75%)) in the Conv group (n = 51 admissions) compared to 10.6, 9.9, and 10.6 in the Mono group (n = 47)(P<0.05 for all). Sixteen percent in the Conv group and 15% of patients in the Mono group did not respond to therapy by day 10. Long-term PFT patterns were similar for the Conv and Mono groups. The time between admissions did not differ. The Mono group showed a significant increase in tobramycin minimum inhibitory concentrations (MICs) against PA from study entry to study exit (P = 0.02, n = 27 strains); this failed to reach significance in the Conv group (P = 0.08, n = 25). There was no significant increase in the number of isolates, with MIC> or =8 mg/L in both groups. No short- or long-term changes in audiology or serum creatinine were found in either group. After 10 days of IV therapy, the urinary enzyme N-acetyl-beta-d-glucosaminidase/creatinine ratios increased in both groups (P0.05). This increase was greater in the Conv compared to the Mono group (P < 0.05). We conclude that this pilot study indicates once-daily tobramycin therapy to be as effective and safe as conventional 8-hourly tobramycin/ceftazidime therapy. Combination antibacterial therapy appears to offer no clinical advantage over once-daily tobramycin monotherapy. Tobramycin once-daily monotherapy is a potential alternative to conventional IV antibacterial therapy which deserves further investigation, including the impact on susceptibility of PA to tobramycin.",
    "full_title": "Efficacy of once-daily tobramycin monotherapy for acute pulmonary exacerbations of cystic fibrosis: a preliminary study (2001) doi:https://dx.doi.org/10.1002/ppul.1060"
  },

    "doi": "https://dx.doi.org/10.1002/ppul.1950040403",
    "recommend": "Seventeen patients with cystic fibrosis (CF) and pulmonary exacerbations were randomly assigned to two treatment groups: piperacillin 600 mg/kg/day (P), and piperacillin 600 mg/kg/day plus tobramycin (PT), in order to determine the safety and pharmacokinetics of high-dose piperacillin and whether piperacillin alone was effective for the treatment of Pseudomonas infections. The mean half-life of piperacillin was 0.54 hours, with a peak concentration of 232 micrograms/ml. No differences between P and PT groups were noted in clinical assessment, as judged by Shwachman scores, pulmonary function testing, or weight gain. However, during the course of treatment, quantitative sputum cultures decreased by greater than 10(2) colony-forming units in only 5 out of 19 Pseudomonas isolates from the P group, compared with 12 of 19 isolates from the PT group (P less than 0.03, Chi-square). Although emergence of resistance was not seen, one isolate had an increase in minimum inhibitory concentration from 8 to 128 micrograms/ml. There were no serious adverse reactions to piperacillin; only one patient developed fever possibly related to piperacillin. Therapy with high-dose piperacillin was safe in children with CF. Treatment with piperacillin alone was less effective than combination therapy with gentamicin for reduction in titer of Pseudomonas in sputum. However, the role of antimicrobial agents in the treatment of CF remains undefined. A double-blind placebo-controlled trial is indicated.",
    "full_title": "Comparison of piperacillin alone versus piperacillin plus tobramycin for treatment of respiratory infections in children with cystic fibrosis (1988) doi:https://dx.doi.org/10.1002/ppul.1950040403"
  },

    "doi": "https://dx.doi.org/10.1093/jac/11.suppl_b.195",
    "recommend": "Patients with cystic fibrosis hospitalized because of deterioration in their pulmonary disease were randomly assigned to receive ten days of intravenous antibiotic therapy with either ticarcillin plus tobramycin (previously the standard regimen at our hospital), azlocillin plus tobramycin or azlocillin plus placebo. Pulmonary function and microbiological responses were similar in the three treatment groups, although patients receiving azlocillin and placebo tended to have a smaller reduction in the concentration of bacteria in the sputum and a greater rate of acquisition of antibiotic-resistant organisms. Overall, in-hospital treatment was associated with a significant improvement in Shwachman score, pulmonary function tests, and PO2. Improvement was noted by day 5 of therapy, continued through day 10, and was partially maintained at follow-up clinic visit one month after discharge. There was also a statistically significant reduction in sputum bacterial concentration, but patients cultured at the conclusion of antibiotic therapy still had a mean of 10(7) cfu/ml in sputum. Pseudomonas aeruginosa, the principal pathogen recovered from sputum cultures in this study, was transiently suppressed to sub-detectable levels in only one patient. There was no correlation between microbiological response and change in any parameter of pulmonary function. By follow-up clinic visit, sputum bacteria had returned to pre-treatment levels, and antibiotic-resistant organisms persisted in all patients from whom they had been recovered during hospitalization.",
    "full_title": "Randomized, double-blind evaluation of azlocillin for the treatment of pulmonary exacerbations of cystic fibrosis (1983) doi:https://dx.doi.org/10.1093/jac/11.suppl_b.195"

    "doi": "https://clinicaltrials.gov/study/NCT02918409",
    "recommend": "The purpose of this study is to find the safest and most effective way to administer IV antibiotics to treat acute pulmonary exacerbations (APEs) in patients with cystic fibrosis (CF) that are caused by pathogens, like Pseudomonas aeruginosa. This study will test the safety and effectiveness of two commonly prescribed IV antibiotics: tobramycin and colistin. Though regularly used, not much is known about how these drugs compare with each other in terms of their toxicities, both during short term treatment of an APE and after many treatment courses with these drugs over many years. There are currently no guidelines on the safest and most effective antibiotics to use when treating APEs. We will study kidney function, sputum cultures, and treatment outcomes in patients receiving routine administration of one of these two IV antibiotics. We will also test these outcomes in patients receiving a less frequent dosing schedule for IV colistin. The hope is that this new schedule for IV colistin, which is twice a day and adjusted based on blood and urine tests, will reduce harmful side effects, such as kidney damage, while still being a powerful treatment against CF microbial pathogens.",
    "full_title": "IV colistin for pulmonary exacerbations: improving safety and efficacy (2016)"
  },

    "recommend": "To evaluate whether the addition of an aminoglycoside might enhance the clinical efficacy of ceftazidime in cystic fibrosis patients with acute exacerbations of chronic Pseudomonas lung infections we carried out a prospective, comparative, randomized blind study with three schedules: ceftazidime vs. ceftazidime plus sisomicin (C/S) vs. piperacillin plus sisomicin, for a total of 60 courses of 14 days of treatment. Each treatment led to clinical and radiologic improvement with marked reduction of signs of acute infection. Statistically there was no significant difference in clinical responses among the schedules. No side effect appeared during treatments with ceftazidime or C/S. Hyperpyrexia was seen in 35% of patients receiving piperacillin. Decrease in Pseudomonas aeruginosa count to less than 10(5) colony-forming units/ml of sputum was achieved in 60% of patients treated with C/S and in 30% of patients who received ceftazidime or piperacillin plus sisomicin (statistically not significant). A transient increase in mean geometric minimal inhibitory concentrations for ceftazidime and piperacillin was observed at the end of the combined therapies. A larger percentage of persistent resistant strains of P. aeruginosa was seen after the combined therapies. We conclude that ceftazidime as monotherapy may be an effective alternative in Pseudomonas lung infections in cystic fibrosis patients. Its clinical efficacy seems not to be enhanced by the addition of an aminoglycoside, although reduction of Pseudomonas in the sputum was better achieved by the combination of C/S.",

    "doi": "https://dx.doi.org/10.1136/thx.39.4.299",
    "recommend": "A randomised controlled open comparison of azlocillin and gentamicin versus carbenicillin and gentamicin was carried out in patients with cystic fibrosis who were chronically infected with Pseudomonas aeruginosa. The clinical response was assessed by measurements of pulmonary function and of the patients' feelings of wellbeing scored on a visual analogue scale. The sputum penetration of the antibiotics used was also studied. The two groups of 10 patients were similar in terms of age, sex, and pulmonary function at entry to the trial. Both regimens produced significant improvement in pulmonary function over 10 days. The mean FEV1 in the azlocillin group increased from 1206 to 1760 ml (p less than 0.001). In the carbenicillin group the mean FEV1 increased from 1116 to 1619 ml (p less than 0.001). Significant improvements in peak expiratory flow rate, forced vital capacity, and score on the visual analogue scale were also seen but there was no significant difference between the antibiotic regimens. Despite high serum concentrations the sputum penetration of the antibiotics was poor.",

    "\ufeff": "30",

    "doi": "https://dx.doi.org/10.3389/fphar.2023.1130374",
    "recommend": "Background: Pseudomonas aeruginosa is the most common microorganism found in the sputum culture of Cystic fibrosis (CF) patients causing the pulmonary destruction. Aminoglycosides have a low diffuse rate from lipid membranes, and respiratory system secretions. Regarding the burden of pulmonary exacerbation caused by the pseudomonas aeruginosa in cystic fibrosis patients in the long term and the limited number of clinical trials focused on appropriate treatment strategies, the present study evaluated the concurrent inhaled and intravenous aminoglycoside antibiotics for pulmonary exacerbation caused by the pseudomonas aeruginosa as a safe and effective treatment in children. Method: This study was a blinded, randomized clinical trial phase conducted in a tertiary referral pediatric teaching hospital from May 2021 to May 2022. The patients were randomly allocated to receive intravenously administered ceftazidime and Amikacin alone or with inhaled Amikacin. Forced expiratory volume (FEV1), Amikacin via the level, kidney function tests, audiometry, inflammatory markers (erythrocyte sedimentation rate and C-reactive protein), hospital stay, and bacterial eradication rate were compared in two therapy groups. Results: the average FEV1 has increased by 47% in Neb + group compared to Neb- group following treatment. Hospital stay was lower in Neb + group. No renal toxicity or ototoxicity was observed in both therapy groups. Pseudomonas aeruginosa eradication rate Neb- and Neb + groups were 44% and 69%, respectively (p-value = 0.15). Conclusion: Concurrent inhaled and intravenous Amikacin is safe and effective to treat Pseudomonas aeruginosa exacerbation in CF patients. Moreover, co-delivery antibiotics' route treatment increased the eradication rate. Although not statistically significant, never the less, it is clinically relevant. The intervention reduced the length of hospitalization in this group. Clinical Trial Registration: clinicaltrials.gov, identifier [IRCT20120415009475N10].",
    "full_title": "Evaluating the efficacy of inhaled amikacin as an adjunct to intravenous combination therapy (ceftazidime and amikacin) in pediatric cystic fibrosis pulmonary exacerbation (2023) doi:https://dx.doi.org/10.3389/fphar.2023.1130374"

    "recommend": "We evaluated patients with cystic fibrosis (CF) and moderate obstructive lung disease in pulmonary exacerbation in a double-blind placebo-controlled trial to determine the contribution of antibiotic-mediated reduction in sputum bacterial density to clinical improvement. For the first 4 days of study, all patients received bronchodilating aerosols and chest physiotherapy but no antibiotics. During this time, the patients showed significant improvement in mean FVC, FEV1, and maximal midexpiratory flow rate (FEF25-75). In 12 of 13 trials, the patients showed no significant increases in the density of Pseudomonas aeruginosa during these first 4 days. In these 12 trials, the patients were stratified by their initial FVC and randomized to receive either parenteral tobramycin and ticarcillin (n = 7) or placebo (n = 5), in addition to continued aerosol and chest physiotherapy. In the remaining trial, the patient had a significant rise in the density of P. aeruginosa and was assigned to the antibiotic group. During the next 14 days of therapy, the antibiotic group showed significantly (p less than 0.01) greater reductions in log10 colony-forming units (cfu) of P. aeruginosa per gram of sputum and greater increases in FVC, FEV1, and FEF25-75 than did the placebo group. The degree of decrease in log10 cfu P. aeruginosa/g sputum correlated significantly (p less than 0.001) with the degree of improvement in FVC, FEV1, and FEF25-75.(ABSTRACT TRUNCATED AT 250 WORDS)",
    "full_title": "Reduction of sputum Pseudomonas aeruginosa density by antibiotics improves lung function in cystic fibrosis more than do bronchodilators and chest physiotherapy alone (1990) doi:https://dx.doi.org/10.1164/ajrccm/141.4_Pt_1.914"

    "recommend": "Background: More data on the efficacy and safety of ciprofloxacin in pediatric cystic fibrosis patients are needed.\nMethods: One hundred eight pediatric cystic fibrosis patients (ages 5 to 17 years) with acute bronchopulmonary exacerbations entered a randomized multicenter trial designed to compare the safety and efficacy of antipseudomonas therapy with oral ciprofloxacin (15 mg/kg twice daily; maximum dosage 750 mg twice daily) or intravenous ceftazidime plus tobramycin (CAZ/TM) for 14 days.\nResults: Clinical improvement was observed in 93% of patients treated with oral ciprofloxacin and in 96% of those receiving parenteral therapy. Transient suppression of Pseudomonas aeruginosa was achieved in 63% of patients at the end of the course of iv CAZ/TM therapy and in 24% receiving ciprofloxacin. Ultrasound examination and nuclear magnetic resonance imaging scans showed no evidence of cartilage toxicity in any of the ciprofloxacin-treated patients. Musculoskeletal adverse events were reported with similar frequency in the two groups of patients (7% in the group receiving ciprofloxacin therapy and 11% in the IV CAZ/TM group). The only sustained musculoskeletal symptom was a case of synovitis in a patient receiving parenteral CAZ/TM.\nConclusion: Ciprofloxacin thus appears to be safe and effective for use in young patients with bronchopulmonary exacerbation of cystic fibrosis.",
    "full_title": "Oral ciprofloxacin vs. intravenous ceftazidime plus tobramycin in pediatric cystic fibrosis patients: comparison of antipseudomonas efficacy and assessment of safety with ultrasonography and magnetic resonance imaging (1997) doi:https://dx.doi.org/10.1097/00006454-199706000-00007"

    "recommend": "A randomised double blind 2-week trial of monotherapy with ceftazidime and aztreonam was completed in 22 adults with cystic fibrosis. 26 courses of treatment were initiated and 22 courses were completed. Within groups, both ceftazidime and aztreonam demonstrated a significant improvement in FEV1 at 2 weeks (ceftazidime p less than 0.05; aztreonam p less than 0.01) and a decline in sputum weight at 2 weeks (ceftazidime p less than 0.05; aztreonam p less than 0.05). Between groups, for spirometry and sputum weight the only change was a slower decline in FEV1 in the aztreonam group at 42 days (p less than 0.05).",

    "recommend": "High-dose anti-Pseudomonas chemotherapy is mandatory in the treatment of acute pulmonary exacerbations in patients with advanced cystic fibrosis and Pseudomonas aeruginosa isolated from their sputum. However, neither the regimen itself nor its objective evaluation have been optimized yet. In a prospective controlled evaluation 42 such exacerbations were treated for two weeks with netilmicin combined by randomisation with either azlocillin or ticarcillin. Other aspects of therapy were constant. The two therapy groups were comparable in all aspects. Both regimens produced similar improvements in clinical, radiological, laboratory, bacteriological and pulmonary function measurements. Concentrations of sputum bacteria were significantly reduced; transient eradication was documented in 29% and correlated with antibiotic susceptibility of the initially isolated Pseudomonas strains. The highly dosed antibiotics were well tolerated and emergence of resistance was rarely observed. It is concluded that both antibiotic combinations are beneficial and safe in cystic fibrosis. Monitoring of such intensive hospital treatment must include multiple parameters.",
    "full_title": "Antimicrobial therapy of Pseudomonas pulmonary exacerbations in cystic fibrosis. A prospective evaluation of netilmicin plus azlocillin versus netilmicin plus ticarcillin (1986) doi:https://dx.doi.org/10.1111/j.1651-2227.1986.tb10169.x"
  },

    "recommend": "Eighty-seven patients with cystic fibrosis were admitted to hospital with an acute exacerbation of pulmonary symptoms associated with isolation of Pseudomonas aeruginosa from sputum. The patients were randomly allocated to receive intravenously administered ceftazidime (250 mg/kg/day) and amikacin (33 mg/kg/day) alone or with inhaled amikacin (100 mg twice a day). Other aspects of the 2-week treatment were constant. The two therapy groups were comparable in all aspects. At the completion of therapy, the addition of aerosolized amikacin produced temporary eradication of P. aeruginosa in 70% of the patients, compared with 41% in the intravenous therapy only group (P less than 0.02). Suppression of P. aeruginosa in sputum cultures was correlated with the amikacin sputum concentrations. However, both regimens resulted in similar improvements in clinical, radiologic, laboratory, and pulmonary function measurements, and within 4 to 6 weeks most patients were recolonized with P. aeruginosa. There was no serious toxicity or adverse effect. In patients with cystic fibrosis, the addition of aerosol aminoglycoside to systemic antipseudomonal combination therapy is not clinically beneficial.",

        // Add this function to calculate maximum button width
        function calculateMaxButtonWidth() {
            // Define the padding you want on each side
            var padding = 20;
            
            // Create a temporary SVG text element for measurement
            var tempText = svg.append("text")
                .attr("font-family", "Helvetica")
                .attr("font-size", "14px")
                .style("opacity", 0); // Make it invisible
            
            var maxWidth = 0;
            
            // First collect all possible button texts
            var buttonTexts = [];
            
            // Get unique topics from dataset_links
            var uniqueTopics = [];
            for (var i = 0; i < dataset_links.length; i++) {
                var topic = dataset_links[i].topic;
                if (!uniqueTopics.includes(topic)) {
                    uniqueTopics.push(topic);
                    buttonTexts.push(topic);
                }
            }
            
            // Add other button texts
            buttonTexts.push("Reset");
            // Add any other fixed button texts here
            
            // Measure each text and find the maximum width
            for (var i = 0; i < buttonTexts.length; i++) {
                tempText.text(buttonTexts[i]);
                var width = tempText.node().getComputedTextLength();
                if (width > maxWidth) {
                    maxWidth = width;
                }
            }
            
            // Remove the temporary text element
            tempText.remove();
            
            // Calculate button width with padding
            var buttonWidth = maxWidth + (padding * 2);
            
            // Return the calculated width
            return buttonWidth;
        }

        function setSquareArrangement() {
            // loop to empirically set the square node positions
            // note this calls and adjusts the global variables
            // first reset the data
            group_0_counter = 0;
            group_1_counter = 1;

            // Adjust these values to control the horizontal position
            var left_offset  = button_width + margin;  // Changed from w/3 to w/4 (smaller value = closer to center)
            var right_offset =  margin; // Changed from w/3 to w/4
            
            for (i = 0; i < dataset.length; i++) {
                if (dataset[i].group == 0) {
                    group_0_counter = group_0_counter + 1;
                    dataset[i].x_coord = left_offset;  // Use the new variable
                    dataset[i].y_coord = (group_0_counter) * (h * 0.9) / (group_0 + 1);

                } else if (dataset[i].group == 1) {
                    group_1_counter = group_1_counter + 1;
                    dataset[i].x_coord = w - right_offset;  // Use the new variable
                    dataset[i].y_coord = (group_1_counter) * (h * 0.9) / (group_1 + 1);
                }
            }
        }

        function setCircleArrangement() {
            // loop to set the circular node positions
            // note this calls and adjusts the global variables
            // makes use of group_0, and group_1
            // need to use group_1_counter and group_0_counter
            //   to keep track of the groups (in case they're 
            //   in funny orders)
            // circle offset is amount of the bottom and top of the circle to leave off
            // console.log("in set circle arangement");
            var circle_offset = 0.3;
            var separation = 50;
            var group_0_counter = Math.round(circle_offset / 2 * group_0);
            var group_1_counter = Math.round(circle_offset / 2 * group_1);
            var centre_x = w / 2 + button_width /2;
            var centre_y = h / 2;
            var left_offset  = button_width + margin;

            var radius_option1 = h * 0.45;  // Original height-based radius
            var radius_option2 = (w / 2) - (left_offset / 2); // Width-based radius considering buttons
            
            // Use the smaller of the two values
            var rad = Math.min(radius_option1, radius_option2) * 0.9;
            console.log("debugging setCicleArrangement");
            console.log(h);
            console.log(w);
            console.log(rad);
            for (i = 0; i < dataset.length; i++) {
                if (dataset[i].group == 0) {
                    dataset[i].x_coord = centre_x - separation - rad * Math.sin((group_0_counter * (3.14159265 / (group_0 + Math.round(circle_offset * group_0)))));
                    dataset[i].y_coord = centre_y - rad * Math.cos((group_0_counter * (3.14159265 / (group_0 + Math.round(circle_offset * group_0)))));
                    group_0_counter = group_0_counter + 1;
                } else if (dataset[i].group == 1) {
                    dataset[i].x_coord = centre_x + separation + (rad) * Math.sin((group_1_counter * (3.14159265 / (group_1 + Math.round(circle_offset * group_1)))));
                    dataset[i].y_coord = centre_y - (rad) * Math.cos((group_1_counter * (3.14159265 / (group_1 + Math.round(circle_offset * group_1)))));
                    group_1_counter = group_1_counter + 1;
                }
            }
        }

        function createMultiLineMiddle(text, mdx) {
            var words = text.split(' ');

            // Get dimensions of the rectangle
            var text_width = popup_w * .5 - 20;
            var rectangle_height = popup_h * 1.6; // Match the height of the middle rectangle
            var line_height = 18; // Height of each line of text
            var initial_y_offset = 30; // Initial y position where text starts
            
            // Calculate maximum number of lines that can fit in the rectangle
            var max_lines = Math.floor((rectangle_height - initial_y_offset) / line_height);
            
            var text_element = document.getElementById("multiline-middle-text");
            text_element.textContent = "";
            text_element.setAttribute('style', 'text-align:left; font-family:Helvetica; font-weight:bold; font-size:12px;')
            
            // Create first tspan element
            var current_tspan = document.createElementNS(svgNS, "tspan");
            var text_node = document.createTextNode(words[0] || "");
            
            current_tspan.appendChild(text_node);
            text_element.appendChild(current_tspan);

            var lines_count = 0;
            
            for (var i = 1; i < words.length; i++) {
                // Store current length before adding new word
                var len = current_tspan.firstChild.data.length;
                
                // Try adding the next word
                current_tspan.firstChild.data += " " + words[i];
                
                // Check if it's too long for the width
                if (current_tspan.getComputedTextLength() > text_width) {
                    // Remove the added word (restore to previous length)
                    current_tspan.firstChild.data = current_tspan.firstChild.data.slice(0, len);
                    
                    // Increment line count
                    lines_count += 1;
                    
                    // Check if we've hit the maximum number of lines that can fit
                    if (lines_count >= max_lines - 1) { // Leave one line for ellipsis
                        // Add ellipsis to indicate truncation
                        current_tspan.firstChild.data += "...";
                        break; // Stop processing more words
                    }
                    
                    // Create a new tspan for the next line
                    var next_tspan = document.createElementNS(svgNS, "tspan");
                    next_tspan.setAttributeNS(null, "x", mdx);
                    next_tspan.setAttributeNS(null, "dy", line_height);
                    
                    // Add the current word to the new line
                    var new_text_node = document.createTextNode(words[i]);
                    next_tspan.appendChild(new_text_node);
                    text_element.appendChild(next_tspan);
                    
                    // Update the current tspan reference
                    current_tspan = next_tspan;
                }
            }
        }
        function createMultiLineLeft(text, ldx) {
            // Handle null or empty text
            if (!text || text.trim() === "") {
                text = ""; // Set to empty string
            }
            var words = text.split(' ');

            var text_width = popup_w - 20;
            var text_element = document.getElementById("multiline-left-text");
            text_element.textContent = "";
            text_element.setAttribute('style', 'text-align:left; font-family:Helvetica; font-size:20px;')
            var tspan_element = document.createElementNS(svgNS, "tspan");   // Create first tspan element
            var text_node = document.createTextNode(words[0]);           // Create text in tspan element

            tspan_element.appendChild(text_node);                           // Add tspan element to DOM
            text_element.appendChild(tspan_element);

            var lines_count = 0;  // this variable sets how many lines high it can be
            for (var i = 1; i < words.length; i++) {

                var len = tspan_element.firstChild.data.length;             // Find number of letters in string
                tspan_element.firstChild.data += " " + words[i];            // Add next word

                if (tspan_element.getComputedTextLength() > text_width) {
                    tspan_element.firstChild.data = tspan_element.firstChild.data.slice(0, len); 				// Remove added word
                    lines_count = lines_count + 1;
                    if (lines_count > 13) {
                        tspan_element.firstChild.data = tspan_element.firstChild.data.slice(0, len);  // remove another word
                        tspan_element.firstChild.data += "...";  // add '...'
                        break; // break out of the for loop
                    }
                    var tspan_element = document.createElementNS(svgNS, "tspan");				// Create new tspan element
                    tspan_element.setAttributeNS(null, "x", ldx);
                    tspan_element.setAttributeNS(null, "dy", 20);
                    text_node = document.createTextNode(words[i]);
                    tspan_element.appendChild(text_node);
                    text_element.appendChild(tspan_element);

                }
            }
        }

        function getTopicForNode(nodeTitle) {
            // Search through dataset_links to find the topic
            for (let i = 0; i < dataset_links.length; i++) {
                // If this link points to the node we're looking for
                if (dataset_links[i].termination == nodeTitle) {
                    // Return the topic of this link
                    return dataset_links[i].topic;

            }
            // If no topic was found
            return null;
        }

        //Functions to download the data:
        // Function to read and parse the XLSX file
        function importXLSX(file, callback) {
            var reader = new FileReader();

            reader.onload = function (event) {
                var data = new Uint8Array(event.target.result);
                var workbook = XLSX.read(data, { type: "array" });
                var worksheet = workbook.Sheets[workbook.SheetNames[0]];
                var jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

                var headers = jsonData[0]; // Extract the first row as headers
                var dataArray = jsonData.slice(1); // Remove the first row from the data

                var result = dataArray.map(function (row) {
                    var obj = {};
                    headers.forEach(function (header, index) {
                        obj[header] = row[index];
                    });
                    return obj;
                });

                callback(result);
            };

            reader.readAsArrayBuffer(file);
        }

        function waitForArrays() {
            return new Promise((resolve) => {
                // Function to check if both arrays have data
                function checkArrays() {
                    if (dataset.length > 0 && dataset_links.length > 0) {
                        resolve(); // Resolve the promise when both arrays have data
                    } else {
                        setTimeout(checkArrays, 100); // Check again after a certain delay
                    }
                }

                checkArrays(); // Start checking the arrays
            });
        }
